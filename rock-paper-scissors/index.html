<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>剪刀石頭布</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>剪刀 · 石頭 · 布</h1>

    <section class="choices" aria-label="選擇你的出拳">
      <button class="choice-btn" data-choice="scissors">✌️ 剪刀</button>
      <button class="choice-btn" data-choice="rock">✊ 石頭</button>
      <button class="choice-btn" data-choice="paper">✋ 布</button>
    </section>

    <section class="round-display" aria-live="polite">
      <div class="round-side">
        <p class="round-label">你</p>
        <p class="round-value" id="player-choice">－</p>
      </div>
      <div class="round-side">
        <p class="round-label">電腦</p>
        <p class="round-value" id="computer-choice">－</p>
      </div>
    </section>

    <p class="round-result" id="round-result" aria-live="polite">選一個出拳開始遊戲</p>

    <section class="scoreboard" aria-label="累計戰績">
      <div class="score-item">
        <p class="score-label">勝</p>
        <p class="score-value" id="score-win">0</p>
      </div>
      <div class="score-item">
        <p class="score-label">平</p>
        <p class="score-value" id="score-draw">0</p>
      </div>
      <div class="score-item">
        <p class="score-label">敗</p>
        <p class="score-value" id="score-lose">0</p>
      </div>
    </section>

    <button class="reset-btn" id="reset-btn" type="button">重設</button>

    <section class="history" aria-label="最近5回合對戰紀錄">
      <h2 class="history-title">最近 5 回合紀錄</h2>
      <ol class="history-list" id="history-list">
        <li class="history-empty">尚無紀錄</li>
      </ol>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>木禾食堂｜店家出餐看板</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand"><span class="mark">木</span><strong>木禾食堂</strong> <small>店家出餐</small></div>
        <label class="token-field">X-Merchant-Token
          <input id="merchant-token" type="password" placeholder="demo-token" autocomplete="off" />
        </label>
      </header>

      <main class="layout">
        <section class="panel" aria-label="訂單看板">
          <div class="panel-head">
            <h1>訂單佇列</h1>
            <select id="status-filter" aria-label="依狀態篩選">
              <option value="">全部</option>
              <option value="created">已建立</option>
              <option value="accepted">已接單</option>
              <option value="preparing">出餐中</option>
              <option value="completed">已完成</option>
            </select>
          </div>
          <p id="auth-message" class="auth-message hidden"></p>
          <ul id="order-list" class="order-list"></ul>
        </section>

        <section class="panel detail" aria-label="訂單詳情">
          <h2 id="detail-title">選擇一筆訂單</h2>
          <div id="detail-body" class="detail-body muted">點選左側訂單以檢視明細與操作。</div>
          <div id="detail-actions" class="detail-actions hidden"></div>
        </section>

        <section class="panel customer" aria-label="顧客查詢示意">
          <h2>顧客查詢示意</h2>
          <p class="muted">模擬同一訂單編號在顧客端看到的狀態（US4）。</p>
          <div class="lookup-row">
            <input id="lookup-number" type="text" placeholder="ORD-20261014-A1B2C3D4" />
            <button type="button" id="lookup-btn">查詢</button>
          </div>
          <div id="lookup-result" class="lookup-result"></div>
        </section>
      </main>
    </div>
    <div id="toast" class="toast hidden" role="status"></div>
    <script src="assets/app.js"></script>
  </body>
</html>

openapi: 3.0.3
info:
  title: 訂單建立與查詢 HTTP API
  version: 0.1.0
  description: |
    在第二迭代購物車之上，提供匿名訪客由目前工作階段購物車建立訂單及查詢訂單的 REST JSON 契約。付款／取消見 `specs/005-payment-order-cancellation/contracts/http-api.yaml`；店家出餐 API 見 `specs/004-merchant-serving-workflow/contracts/http-api.yaml`。

    **`Order` 欄位（005 對齊）**：`getOrder` 回應含 `payment_status`／`payment_status_label`；`status` 可含 `cancelled`（005）。

    **整合**：訂單建立須先 `GET /api/cart` 取得 `csrf_token`；`POST /api/orders` 須帶 `X-CSRF-Token` 與精確 `Origin`（同 002 cart 寫入政策）。Session 僅能透過 HttpOnly `guest_session` cookie。

    **冪等**：可選 header `Idempotency-Key`；同 session 重送成功結果時回 200 與相同訂單 body。

    **冪等持久化（spec Q12–Q13）**：`(guest_session_id, Idempotency-Key)` 映射預設保留 **24h**（`expires_at`）；僅 **201** 或 **200** 冪等命中時寫入／更新紀錄。**4xx**／**5xx** 且未建單時**不**寫入冪等成功紀錄，客戶端可重試。
x-contract-metadata:
  sourceSpec: ../spec.md
  systemAnalysisPlan: ../plan.md
  uiPlan: ../ui-plan.md
  dataModel: ../data-model.dbml
  cartApiReference: ../../002-shopping-cart-total-calculation/contracts/http-api.yaml
  authModel: 無登入；訂單歸屬與查詢限建立訂單之同一 guest session。
  idempotencyPolicy: 預設 TTL 86400s；僅成功 201/200 持久化映射；4xx/5xx 未建單不寫入（spec 澄清 Q12–Q13）。
  createOrderBodyPolicy: CreateOrderRequest 不允許額外欄位；不接受客戶端權威金額。
  paymentApiReference: ../../005-payment-order-cancellation/contracts/http-api.yaml
servers:
  - url: http://localhost:3000/api
    description: 本機 Express（PORT 可覆寫）
security: []
tags:
  - name: Orders
    description: 由購物車建立訂單與查詢
paths:
  /orders:
    post:
      tags:
        - Orders
      operationId: createOrder
      summary: 由目前工作階段購物車建立訂單
      description: |
        **需求追溯**：User Story 1；FR-001–FR-007、FR-010、FR-011；BR-001–BR-003；SC-001–SC-004、SC-006。

        伺服器讀取目前 session 的 cart，重新驗證每項 availability=available；存在 unavailable 或無可用項目時拒絕且不寫入訂單。成功時產生唯一 order_number、持久化快照金額、清空 cart。

        請求 body 可為空物件 `{}`；schema 不允許額外欄位（`additionalProperties: false`）。可選 `Idempotency-Key` header（1–128 字元）；命中未過期冪等記錄時回 200 與原訂單，不建立第二筆。4xx/5xx 未建單時不寫入冪等紀錄。
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
          description: 與目前 guest session 配對之冪等鍵；缺漏時每次有效請求獨立建單。
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
        - in: header
          name: Origin
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: 新建立的訂單
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '200':
          description: 冪等重送；回傳既有訂單
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: 購物車無可用項目等
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                cartEmpty:
                  summary: 空車或僅不可用項目
                  value:
                    error:
                      code: CART_EMPTY
                      message: 購物車沒有可送單的項目。
          x-errorCases: CART_EMPTY
        '409':
          description: 購物車含不可用項目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                cartHasUnavailableItems:
                  summary: 含不可用 cart 項目
                  value:
                    error:
                      code: CART_HAS_UNAVAILABLE_ITEMS
                      message: 購物車含有不可用項目，請先移除後再送單。
          x-errorCases: CART_HAS_UNAVAILABLE_ITEMS
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /orders/{order_number}:
    get:
      tags:
        - Orders
      operationId: getOrder
      summary: 查詢目前工作階段建立的訂單
      description: |
        **需求追溯**：User Story 2；FR-008、FR-009、FR-010、FR-011；SC-005。

        以 path `order_number` 與 cookie 解析之 guest_session_id 同時匹配；否則 404 ORDER_NOT_FOUND（不洩漏他 session 訂單是否存在）。回傳持久化快照金額，不以最新菜單重算。`Order.status` 可為 `created|accepted|preparing|completed|cancelled`；含 `payment_status` 等欄位（與 004／005 對齊）。
      parameters:
        - in: path
          name: order_number
          required: true
          schema:
            type: string
            pattern: '^ORD-[0-9]{8}-[0-9A-F]{8}$'
      responses:
        '200':
          description: 訂單明細與狀態
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: 查無或不屬於目前 session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                orderNotFound:
                  summary: 查無或不屬於目前 session
                  value:
                    error:
                      code: ORDER_NOT_FOUND
                      message: 找不到訂單。
          x-errorCases: ORDER_NOT_FOUND
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:
    OrderStatus:
      type: string
      enum:
        - created
        - accepted
        - preparing
        - completed
        - cancelled

    PaymentStatus:
      type: string
      enum:
        - unpaid
        - pending
        - paid
        - failed
        - refunded

    CreateOrderRequest:
      type: object
      additionalProperties: false
      description: 本迭代無必填 body 欄位；僅允許空物件。不得提交 total、line_total、unit_price 等金額或訂單欄位。

    OrderResponse:
      type: object
      required:
        - order
      properties:
        order:
          $ref: '#/components/schemas/Order'

    Order:
      type: object
      required:
        - order_number
        - status
        - status_label
        - payment_status
        - payment_status_label
        - created_at
        - total
        - items
      properties:
        order_number:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        status_label:
          type: string
          description: 對應 status 之中文標籤（含已取消，005）
          example: 已建立
        payment_status:
          $ref: '#/components/schemas/PaymentStatus'
        payment_status_label:
          type: string
        payment_failure_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        status_updated_at:
          type: string
          format: date-time
          nullable: true
        paid_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        refunded_at:
          type: string
          format: date-time
          nullable: true
          description: payment_status 為 refunded 時之模擬退款完成時間（005 FR-013）
        total:
          $ref: '#/components/schemas/MoneyAmount'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

    OrderItem:
      type: object
      required:
        - menu_item_id
        - menu_item_name
        - quantity
        - unit_price
        - line_total
        - options
      properties:
        menu_item_id:
          type: string
          format: uuid
        menu_item_name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_price:
          $ref: '#/components/schemas/MoneyAmount'
        line_total:
          $ref: '#/components/schemas/MoneyAmount'
        options:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemOption'

    OrderItemOption:
      type: object
      required:
        - option_group_id
        - option_group_name
        - menu_item_option_id
        - name
      properties:
        option_group_id:
          type: string
          format: uuid
        option_group_name:
          type: string
        menu_item_option_id:
          type: string
          format: uuid
        name:
          type: string

    MoneyAmount:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'

    ErrorBody:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: |
                訂單建立：`CART_EMPTY`（400）、`CART_HAS_UNAVAILABLE_ITEMS`（409）。
                訂單查詢：`ORDER_NOT_FOUND`（404）。
                安全／基礎設施：沿用 002 `ORIGIN_NOT_ALLOWED`、`CSRF_TOKEN_INVALID`、`SESSION_STORE_UNAVAILABLE`、`PRICING_UNAVAILABLE` 等。
            message:
              type: string
            details:
              type: object
              additionalProperties: true

  responses:
    Forbidden:
      description: Origin 或 CSRF 失敗
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    InternalError:
      description: 未預期錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    ServiceUnavailable:
      description: 資料庫或 session 不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
